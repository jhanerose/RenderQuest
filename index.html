<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenderQuest | Dynamic CG Exam Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-surface-hover: #27272a;
            --border-subtle: #3f3f46;
            --border-active: #06b6d4;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-cyan: #22d3ee;
            --accent-red: #f87171;
            --accent-green: #4ade80;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: rgba(34, 211, 238, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(34, 211, 238, 0.3);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-content h1 {
            margin: 0; font-size: 1.15rem; font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .question-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .question-card p.q-text {
            font-size: 1.05rem;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
        }

        .options-grid { display: flex; flex-direction: column; gap: 10px; }

        .option-label {
            display: flex; align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 8px; cursor: pointer;
            transition: all 0.2s; font-size: 0.95rem;
        }

        .option-label:hover { background: var(--bg-surface-hover); }

        .option-label input[type="radio"] {
            appearance: none; width: 18px; height: 18px;
            border: 2px solid var(--text-muted); border-radius: 50%;
            margin-right: 12px; cursor: pointer; position: relative;
        }

        .option-label input[type="radio"]:checked { border-color: var(--accent-cyan); }
        .option-label input[type="radio"]:checked::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: var(--accent-cyan); border-radius: 50%;
        }

        .option-label.correct {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.1); color: var(--accent-green);
        }
        
        .option-label.incorrect {
            border-color: var(--accent-red);
            background: rgba(248, 113, 113, 0.1); color: var(--accent-red);
        }

        .btn-primary {
            display: block; width: 100%; padding: 16px;
            background: var(--text-main); color: var(--bg-base);
            font-size: 1.05rem; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            margin: 40px 0; transition: transform 0.1s;
        }

        .btn-primary:hover { background: #fff; transform: translateY(-1px); }

        #reset-btn {
            background: var(--accent-cyan);
            display: none;
        }

        #answer-key {
            display: none; padding: 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(34, 211, 238, 0.05);
            border-radius: 8px; margin-bottom: 40px;
        }

        #answer-key.visible { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="brand">
                <h1>RenderQuest</h1>
                <span class="brand-badge" id="set-indicator">Generating New Set...</span>
            </div>
            <div id="score-display" style="font-family: var(--font-mono); color: var(--accent-cyan); font-weight: 500;">Score: --/--</div>
        </div>
    </header>

    <div class="container">
        <div id="answer-key">
            <h3 style="color: var(--accent-cyan); margin-top: 0;">Pipeline Execution Log</h3>
            <p>Review the log below. <span style="color: var(--accent-green)">Green</span> indicates a successful render. <span style="color: var(--accent-red)">Red</span> indicates a compilation error.</p>
        </div>
        <div id="exam-container"></div>
        <button id="submit-btn" class="btn-primary" type="button" onclick="submitExam()">Execute Pipeline (Submit Exam)</button>
        <button id="reset-btn" class="btn-primary" type="button" onclick="generateNewSet()">Generate New Random Set</button>
    </div>

    <script>
        // --- 1. EXTRACTED MCQ BANK (From Set A) ---
        // Note: Expand this array with the remaining extracted text questions.
        const baseQuestions = [
            { q: "A junior artist at your studio delivers the team logo as a raster image. When the logo is enlarged for a loading screen, it becomes blocky and blurred. What is the most appropriate explanation you can give?", opts: ["Raster images are defined by mathematical shapes, which cannot be resized", "Raster images are made of a fixed grid of pixels, so scaling beyond that resolution loses quality", "The GPU refuses to enlarge raster images beyond their original size", "Raster images store no color data, so enlargement exposes empty pixels"], ans: 1 },
            { q: "A team is building a 2D user interface with icons and sprites, and a separate module where a product can be rotated and viewed from any angle under lighting. Which pairing of graphics types is most appropriate?", opts: ["2D (x, y) for the interface; 3D (x, y, z) for the rotatable, lit product", "3D for the interface; 2D for the rotatable product", "2D for both, since rotation can be faked with color changes", "3D for both, since 2D graphics cannot display icons"], ans: 0 },
            { q: "A vertex of a spaceship model is currently expressed relative to the ship itself. To render it, the vertex must next be placed into the scene alongside other objects. Which coordinate-space hand-off does this describe?", opts: ["View space to clip space", "World space to view space", "Clip space to screen space", "Model space to world space"], ans: 3 },
            { q: "A simulation needs to (1) run complex step-by-step game logic and (2) recompute the color of millions of pixels every frame. Based on processor design, what is the best division of work?", opts: ["Logic on the CPU's few powerful cores; per-pixel math on the GPU's thousands of small cores", "Both on the GPU, since it is newer than the CPU", "Per-pixel math on the CPU because pixels need powerful cores; logic on the GPU", "Both on the CPU, using one core per pixel"], ans: 0 },
            { q: "Arrange these high-level events in the order the graphics pipeline performs them: (1) shapes are converted into pixels, (2) vertex data defines shapes, (3) color/lighting/textures are applied, (4) objects are positioned in the scene and camera.", opts: ["2, 1, 4, 3", "4, 2, 3, 1", "2, 4, 1, 3", "1, 2, 4, 3"], ans: 2 },
            { q: "A studio must choose a rendering method for a fast-paced multiplayer game that must run in real time on ordinary GPUs, even at the cost of less realistic reflections. Which choice best fits and why?", opts: ["Rasterization, because projecting triangles and filling pixels is extremely fast and suited to real-time games", "Ray tracing, because it is the only method OpenGL supports", "Ray tracing, because following light rays per pixel is fastest", "Rasterization, because it produces perfectly realistic shadows"], ans: 0 },
            { q: "In a Phong-lit scene, a matte crate shows brightness that varies with its angle to the lamp, but the artist complains there is no bright shiny highlight anywhere. Which lighting component is missing?", opts: ["Ambient", "Specular", "Rasterized", "Diffuse"], ans: 1 },
            { q: "A gameplay video looks like a smooth animation even though the screen only ever shows still images. Which concept explains this, and what does its value describe?", opts: ["UV mapping — the number of textures per model", "Resolution — the number of vertices per mesh", "Color depth — how many colors one pixel stores", "Frame rate — how many images are drawn per second"], ans: 3 },
            { q: "A student is confused: 'I installed OpenGL, so why do I need GLEW?' Based on how OpenGL actually works, what is the most accurate correction?", opts: ["OpenGL cannot open windows, and GLEW exists to create windows and read input", "OpenGL is only a specification; the real functions live in the GPU driver, and beyond version 1.1 they must be loaded at runtime, which GLEW does", "GLEW compiles GLSL shaders, which OpenGL cannot do alone", "OpenGL only works on Linux, and GLEW ports it to Windows"], ans: 1 },
            { q: "Your next project needs windowing and input, plus built-in sound mixing, threading helpers, and cross-platform file handling in one library. Which choice best matches these requirements?", opts: ["GLEW, because it wrangles every extension including audio", "GLFW, because it is the course default for all needs", "SDL, because it covers everything GLFW does plus audio, threading, and filesystems", "OpenGL alone, since the spec includes audio"], ans: 2 },
            { q: "A draw call submits 12 vertices to be assembled as triangles. During primitive assembly, how many triangles result, and what else may be removed at this stage?", opts: ["4 triangles; vertices outside the window are converted to quads", "12 triangles; fragments failing the depth test are removed", "6 triangles; nothing is ever removed here", "4 triangles; primitives facing away from the viewer may be removed by face culling"], ans: 3 }
        ];

        // --- 2. PROCEDURAL MATH GENERATOR (Items 51-56 Simulator) ---
        function generateProceduralMath() {
            let mathQuestions = [];

            // Helper for random pos/neg ints
            const rInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            
            // Generate Q51: Vector Addition/Subtraction
            let a = [rInt(2,8), rInt(2,8), rInt(2,8)];
            let b = [rInt(1,4), rInt(1,4), rInt(1,4)];
            let multiplier = rInt(2,3);
            let finalDisplacement = `[${multiplier*(a[0]-b[0])}, ${multiplier*(a[1]-b[1])}, ${multiplier*(a[2]-b[2])}]`;
            
            mathQuestions.push({
                q: `Vector operations. A game character's intended step this frame is a = [${a}]. An obstacle pushes it back by b = [${b}] (i.e., subtract b). The result is then multiplied by ${multiplier} for a sprint boost. Compute the final displacement vector.`,
                opts: [
                    finalDisplacement,
                    `[${a[0]-b[0]}, ${a[1]-b[1]}, ${a[2]-b[2]}]`,
                    `[${multiplier*(a[0]+b[0])}, ${multiplier*(a[1]+b[1])}, ${multiplier*(a[2]+b[2])}]`,
                    `[${(a[0]-b[0])/multiplier}, ${(a[1]-b[1])/multiplier}, ${(a[2]-b[2])/multiplier}]`
                ],
                ans: 0
            });

            // Generate Q52: Magnitude
            let v = [rInt(2,6), rInt(2,6), rInt(2,6)];
            let mag = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]).toFixed(2);
            
            mathQuestions.push({
                q: `Magnitude. A camera must know how far a target is. The vector from camera to target is v = [${v}]. Compute |v| (rounded to 2 decimal places).`,
                opts: [
                    `${mag}`,
                    `${(v[0]+v[1]+v[2]).toFixed(2)}`,
                    `${(Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) * 2).toFixed(2)}`,
                    `${(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]).toFixed(2)}`
                ],
                ans: 0
            });

            // Generate Q54: Dot Product
            let dpA = [rInt(1,5), rInt(1,5), rInt(1,5)];
            let dpB = [rInt(1,5), rInt(1,5), rInt(1,5)];
            let dotProduct = (dpA[0]*dpB[0]) + (dpA[1]*dpB[1]) + (dpA[2]*dpB[2]);

            mathQuestions.push({
                q: `Dot product. Compute [${dpA}] · [${dpB}] using the component method. State whether the result is a vector or a scalar.`,
                opts: [
                    `${dotProduct} (Scalar)`,
                    `[${dpA[0]*dpB[0]}, ${dpA[1]*dpB[1]}, ${dpA[2]*dpB[2]}] (Vector)`,
                    `${dotProduct} (Vector)`,
                    `${(dpA[0]+dpB[0]) + (dpA[1]+dpB[1]) + (dpA[2]+dpB[2])} (Scalar)`
                ],
                ans: 0
            });

            // Generate Q56: Cross Product
            let cxA = [1, 0, 0]; 
            let cxB = [0, 1, 0];
            // Cross product of Unit X and Unit Y is Unit Z [0,0,1]
            let crossRes = `[0, 0, 1]`;

            mathQuestions.push({
                q: `Cross product. A triangle has edge vectors A = [${cxA}] and B = [${cxB}]. Compute A × B.`,
                opts: [
                    crossRes,
                    `[1, 1, 0]`,
                    `0 (Scalar)`,
                    `[1, 0, 1]`
                ],
                ans: 0
            });

            return mathQuestions;
        }

        // --- 3. EXAM CONTROLLER ---
        let currentActiveExam = [];

        // Shuffle an array (Fisher-Yates)
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function generateNewSet() {
            // Reset UI
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('answer-key').classList.remove('visible');
            document.getElementById('score-display').innerText = `Score: --/--`;
            
            // Randomize Set ID for visual flair
            const setIDs = ['B', 'C', 'D', 'E', 'F', 'G', 'H'];
            const randomSet = setIDs[Math.floor(Math.random() * setIDs.length)];
            document.getElementById('set-indicator').innerText = `Rendering Exam Set: ${randomSet}`;

            // Combine MCQs and Procedural Math
            let freshQuestions = [...baseQuestions, ...generateProceduralMath()];
            
            // Shuffle Questions Order
            freshQuestions = shuffleArray(freshQuestions);

            // Shuffle Options within each question and track correct answer
            currentActiveExam = freshQuestions.map(item => {
                let optionsWithMeta = item.opts.map((optText, i) => {
                    return { text: optText, isCorrect: (i === item.ans) };
                });
                
                shuffleArray(optionsWithMeta);
                
                // Find new index of the correct answer
                let newCorrectIndex = optionsWithMeta.findIndex(o => o.isCorrect);
                
                return {
                    q: item.q,
                    opts: optionsWithMeta.map(o => o.text),
                    ans: newCorrectIndex
                };
            });

            renderExam();
        }

        function renderExam() {
            const container = document.getElementById('exam-container');
            let htmlContent = "";

            currentActiveExam.forEach((item, index) => {
                let optionsHtml = item.opts.map((opt, i) => `
                    <label class="option-label" id="lbl-q${index}-${i}">
                        <input type="radio" name="q${index}" value="${i}"> ${opt}
                    </label>
                `).join('');

                htmlContent += `
                    <div class="question-card" id="card-q${index}">
                        <p class="q-text"><span style="color:var(--accent-cyan)">${index + 1}.</span> ${item.q}</p>
                        <div class="options-grid">${optionsHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitExam() {
            let score = 0;
            const total = currentActiveExam.length;
            let unanswered = 0;

            currentActiveExam.forEach((_, index) => {
                if (!document.querySelector(`input[name="q${index}"]:checked`)) unanswered++;
            });

            if (unanswered > 0) {
                if(!confirm(`You have ${unanswered} unanswered questions.\n\nExecute pipeline anyway?`)) return;
            }

            currentActiveExam.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const correctId = `lbl-q${index}-${item.ans}`;
                
                // Highlight correct
                document.getElementById(correctId).classList.add('correct');

                if (selected) {
                    const userVal = parseInt(selected.value);
                    if (userVal === item.ans) {
                        score++;
                    } else {
                        // Highlight incorrect
                        document.getElementById(`lbl-q${index}-${userVal}`).classList.add('incorrect');
                    }
                }
            });

            const percentage = Math.round((score / total) * 100);
            document.getElementById('score-display').innerText = `Score: ${score}/${total} (${percentage}%)`;
            
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'block';
            document.getElementById('answer-key').classList.add('visible');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Init first load
        window.onload = generateNewSet;
    </script>
</body>
</html>
